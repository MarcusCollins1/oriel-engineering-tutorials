
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oxford Engineering Tutorials</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <h1>Engineering Tutorials</h1>
        <p>Oxford · Group tutorial planner</p>
      </div>
      <div class="user-area">
        <span id="userName"></span>
        <button id="changeNameBtn" class="btn secondary">
          Change name
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <div>
        <h2>Modules & Tutorials</h2>
        <p>
          Choose a module, find a tutorial time,
          and sign up with your coursemates.
        </p>
      </div>
      <button id="newModuleBtn" class="btn primary">
        + New module
      </button>
    </section>

    <section class="filters">
      <div class="course-filters">
        <button class="filter active" data-course="all">All</button>
        <button class="filter" data-course="A1">A1</button>
        <button class="filter" data-course="A2">A2</button>
        <button class="filter" data-course="A3">A3</button>
        <button class="filter" data-course="A4">A4</button>
      </div>
    </section>

    <p id="statusMessage" class="status-message" role="status"></p>

    <section id="moduleList" class="module-list">
      <p class="empty-state">Loading modules...</p>
    </section>
  </main>

  <!-- NAME DIALOG -->
  <dialog id="nameDialog" class="modal">
    <form id="nameForm">
      <h2>Welcome!</h2>
      <p>Enter your name to use the tutorial planner.</p>

      <label for="nameInput">Your name</label>
      <input id="nameInput" type="text" maxlength="40" required>

      <div class="modal-actions">
        <button type="submit" class="btn primary">
          Continue
        </button>
      </div>
    </form>
  </dialog>

  <!-- CREATE MODULE DIALOG -->
  <dialog id="moduleDialog" class="modal">
    <form id="moduleForm">
      <div class="modal-header">
        <h2>Create module</h2>
        <button type="button" class="icon-btn"
                data-close="moduleDialog" aria-label="Close">
          &times;
        </button>
      </div>

      <label for="courseInput">Course</label>
      <select id="courseInput" required>
        <option value="">Select course</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="A3">A3</option>
        <option value="A4">A4</option>
      </select>

      <label for="moduleInput">Module code</label>
      <input id="moduleInput" type="text"
             placeholder="e.g. A1D"
             maxlength="12" required>

      <label for="moduleDescriptionInput">Topic / Description</label>
      <input id="moduleDescriptionInput" type="text" placeholder="e.g. Thermodynamics" maxlength="100">

      <div class="modal-actions">
        <button type="button" class="btn secondary"
                data-close="moduleDialog">Cancel</button>
        <button type="submit" id="createModuleBtn"
                class="btn primary">Create module</button>
      </div>
    </form>
  </dialog>

  <!-- CREATE TUTORIAL DIALOG -->
  <dialog id="tutorialDialog" class="modal">
    <form id="tutorialForm">
      <div class="modal-header">
        <h2>Add tutorial slot</h2>
        <button type="button" class="icon-btn"
                data-close="tutorialDialog" aria-label="Close">
          &times;
        </button>
      </div>

      <p id="selectedModuleLabel" class="selected-module"></p>

      <label for="dateInput">Date</label>
      <input id="dateInput" type="date" required>

      <div class="form-row">
        <div>
          <label for="startTimeInput">Start time</label>
          <input id="startTimeInput" type="time" required>
        </div>
        <div>
          <label for="endTimeInput">End time</label>
          <input id="endTimeInput" type="time" required>
        </div>
      </div>

      <label for="locationInput">Location</label>
      <input id="locationInput" type="text"
             placeholder="e.g. College"
             maxlength="100" required>

      <label class="checkbox-label">
        <input type="checkbox" id="joinCreatorInput" checked>
        Automatically sign me up
      </label>

      <div class="modal-actions">
        <button type="button" class="btn secondary"
                data-close="tutorialDialog">Cancel</button>
        <button type="submit" id="createTutorialBtn"
                class="btn primary">Add tutorial</button>
      </div>
    </form>
  </dialog>

  
  <!-- EDIT MODULE -->
  <dialog id="editModuleDialog" class="modal">
    <form id="editModuleForm">
      <div class="modal-header">
        <h2>Edit module</h2>
        <button type="button" class="icon-btn"
                data-close="editModuleDialog"
                aria-label="Close">&times;</button>
      </div>

      <p id="editModuleLabel" class="selected-module"></p>

      <label for="editModuleDescription">
        Topic / Description
      </label>
      <input id="editModuleDescription"
            type="text" maxlength="100">

      <div class="modal-actions">
        <button type="button" class="btn secondary"
                data-close="editModuleDialog">Cancel</button>
        <button type="submit" id="saveModuleBtn"
                class="btn primary">Save changes</button>
      </div>
    </form>
  </dialog>

  <!-- EDIT TUTORIAL -->
  <dialog id="editTutorialDialog" class="modal">
    <form id="editTutorialForm">
      <div class="modal-header">
        <h2>Edit tutorial</h2>
        <button type="button" class="icon-btn"
                data-close="editTutorialDialog"
                aria-label="Close">&times;</button>
      </div>

      <label for="editDateInput">Date</label>
      <input id="editDateInput" type="date" required>

      <div class="form-row">
        <div>
          <label for="editStartTimeInput">Start time</label>
          <input id="editStartTimeInput" type="time" required>
        </div>
        <div>
          <label for="editEndTimeInput">End time</label>
          <input id="editEndTimeInput" type="time" required>
        </div>
      </div>

      <label for="editLocationInput">Location</label>
      <input id="editLocationInput" type="text"
            maxlength="100" required>

      <div class="modal-actions">
        <button type="button" class="btn secondary"
                data-close="editTutorialDialog">Cancel</button>
        <button type="submit" id="saveTutorialBtn"
                class="btn primary">Save changes</button>
      </div>
    </form>
  </dialog>

</body>
</html>
